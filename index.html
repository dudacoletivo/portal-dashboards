<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Dashboards</title>
<link rel="icon" type="image/jpeg" href="assets/logos/agencia-coletivo.jpg">
<style>
  :root{
    --ink:#1b2430;
    --ink-soft:#5b6675;
    --bg:#f4f6fb;
    --card:#ffffff;
    --line:#e7ebf3;
    --accent:#4f5eff;
    --accent-soft:#eef0ff;
    --shadow: 0 1px 2px rgba(16,38,73,.05), 0 8px 24px rgba(16,38,73,.08);
    --red:#c8433d;
    --red-bg:#fbeaea;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: Calibri, 'Segoe UI', Candara, Optima, Arial, sans-serif;
    background:
      radial-gradient(560px 340px at 8% 0%, rgba(79,94,255,.07), transparent 60%),
      radial-gradient(620px 380px at 96% 18%, rgba(200,67,61,.06), transparent 60%),
      var(--bg);
    color: var(--ink);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding: 24px;
  }

  /* Elementos decorativos discretos no fundo */
  .deco{ position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0; }
  .deco-1{ width:340px; height:340px; top:-120px; left:-120px; background:rgba(79,94,255,.14); }
  .deco-2{ width:300px; height:300px; bottom:-100px; right:-80px; background:rgba(248,158,38,.13); }
  .deco-3{ width:220px; height:220px; top:38%; right:6%; background:rgba(94,18,85,.08); }

  .login-card{
    position:relative; z-index:1;
    background:var(--card); border-radius:24px; box-shadow:0 20px 60px rgba(16,38,73,.14);
    padding:44px 38px 38px; max-width:380px; width:100%; text-align:center;
  }

  .agency-logo{
    width:64px; height:64px; margin:0 auto 20px; border-radius:18px;
    box-shadow:0 10px 24px rgba(30,86,240,.35);
    display:block; object-fit:cover;
  }

  h1{ margin:0 0 8px; font-size:24px; font-weight:800; letter-spacing:.2px; color:#12172a; }
  p.sub{ margin:0 0 28px; color:var(--ink-soft); font-size:14px; }

  label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin-bottom:8px; text-align:left; }
  input[type="password"]{
    width:100%; font-family:inherit; font-size:15px; padding:13px 14px; border-radius:12px;
    border:1.5px solid var(--line); margin-bottom:16px; outline:none; text-align:center; letter-spacing:.1em;
  }
  input[type="password"]:focus{ border-color:var(--accent); }

  .btn{
    width:100%; font-family:inherit; font-size:14.5px; font-weight:700; border-radius:12px; padding:13px 18px;
    border:none; cursor:pointer; background:var(--accent); color:#fff;
    transition: filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.6; cursor:default; }

  .error-msg{
    display:none; background:var(--red-bg); color:var(--red); font-size:12.5px; font-weight:600;
    padding:9px 12px; border-radius:10px; margin-bottom:14px; text-align:left;
  }
  .error-msg.show{ display:block; }

  footer.foot{ text-align:center; font-size:12px; color:#a3adbb; padding:18px 0 0; position:relative; z-index:1; }
</style>
</head>
<body>

<div class="deco deco-1"></div>
<div class="deco deco-2"></div>
<div class="deco deco-3"></div>

<div class="login-card">
  <img src="assets/logos/agencia-coletivo.jpg" alt="Agência Coletivo" class="agency-logo">
  <h1>Portal de Dashboards</h1>
  <p class="sub">Digite sua senha de acesso.</p>

  <div class="error-msg" id="loginError">Senha incorreta. Tente novamente.</div>
  <label for="loginPassword">Senha</label>
  <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
  <button class="btn" id="loginSubmit" type="button">Entrar</button>
</div>

<footer class="foot">Acesso restrito &middot; cada cliente possui login próprio</footer>

<script src="assets/portal-config.js"></script>
<script>
  const passwordInput = document.getElementById('loginPassword');
  const submitBtn = document.getElementById('loginSubmit');
  const errorMsg = document.getElementById('loginError');

  // Não há seleção de cliente na tela — a senha digitada é comparada contra o hash de
  // cada cliente cadastrado até achar a correspondência, e só então redireciona.
  // Isso é proposital: nenhuma marca/nome de cliente aparece nessa tela em nenhum momento.
  async function attemptLogin() {
    const value = passwordInput.value;
    if (!value) return;
    submitBtn.disabled = true;
    errorMsg.classList.remove('show');
    const hash = await portalSha256Hex(value);
    const match = PORTAL_CLIENTS.find(c => c.passwordHash === hash);
    if (match) {
      portalSetSession(match.slug);
      window.location.href = match.file;
    } else {
      errorMsg.classList.add('show');
      passwordInput.value = '';
      passwordInput.focus();
      submitBtn.disabled = false;
    }
  }

  submitBtn.addEventListener('click', attemptLogin);
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  passwordInput.focus();
</script>
</body>
</html>
